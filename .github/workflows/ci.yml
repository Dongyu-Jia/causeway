# Lint, compile and test on every push and pull request.
# A fresh clone has no data/ (it is git-ignored and never published), so the tests that need the
# panel or the built results skip themselves; nothing here downloads data or runs the build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # the full history: tests/test_preregistered.py checks that each pre-registration record was committed frozen
      # before its results (a depth-1 clone cannot tell; never squash-merge those commits)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q scenariolab tools

      - name: Lint (ruff E9, F)
        run: ruff check --output-format=github scenariolab tests tools

      - name: Test
        run: pytest -q
