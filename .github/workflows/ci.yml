# Lint, compile and test on every push and pull request.
# A fresh clone has no data/ (it is git-ignored and never published), so the tests that need the
# panel or the built results skip themselves; nothing here downloads data or runs the build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q scenariolab

      - name: Lint (ruff E9, F)
        run: ruff check --output-format=github scenariolab tests

      - name: Test
        run: pytest -q
