id: japanification
name: 日本化：通缩与长期停滞
summary: 高估值资产缓慢去泡沫、老龄化和过度储蓄压低需求，通胀长期降到 2% 以下，政策利率回到 1% 附近；长债先赚资本利得，股票、地产和现金的名义回报全面变低，模拟的市价/股息比七年降到 81 倍左右。
narrative: |-
  日本在 1990 年股市和地产泡沫破裂后，经历了二十年的低通胀、零利率和资产价格下跌；今天美国的股息率约 1%、家庭净值/收入约 8.1 倍，都处在美国自身历史的极端。
  本情景假设需求不足成为主导：老龄化和高收入家庭的高储蓄压低消费，企业去杠杆、AI 资本开支周期结束，通胀从 3.7% 降到 2% 以下。
  美国样本内最接近的是 2001-03 年通缩恐慌、2009-15 年零利率时期和 2015 年油价崩跌后的去通胀：CPI 约 1.5-2%、政策利率接近零、10 年期约 2-3%；视图放在降息、低通胀、产出停滞、资本开支收缩和失业率温和上升这些根源上，中性实际利率覆盖为 −0.5% 到 −1%。
  但美国的低利率时期恰好是估值扩张推动的牛市：第一阶段抽到的月份本身每年带着约 +5% 的市价/股息扩张，这和日本式的资产去泡沫相反，而且美国历史上从未从今天这样的估值出发进入通缩；所以前七年用有界的覆盖项把美股和纳斯达克的价格漂移每年下调 8 个百分点（覆盖项的上限）、房地产和金融股下调 6 个百分点，这是超出美国历史支撑的部分，单独列出。
  即便如此，抽到月份自带的估值扩张只被部分抵消：模拟路径隐含的市价/股息比两年后仍在 90 倍左右、七年降到 81 倍左右、15 年后约 62 倍，是缓慢的去泡沫，而不是日本那样的长期暴跌。
  利率下行让长期国债在前七年获得可观的资本利得（前两年最多），回归常态后收益率回升、长债的实际收益转负；政策利率两年降到 1.4% 左右、七年降到 1% 附近，10 年期七年降到 2.2% 左右，现金收益随政策利率下降、略低于通胀；失业率先升到 5% 左右，之后在低增长中缓慢回落到 4.2% 左右（日本停滞期的失业率也一直不高）。
  七年后回到无视图的历史常态。
tags: [通缩, 长期停滞, 零利率, 去泡沫]
prior_prob: 0.03
analogs: ["2001-06:2003-12", "2009-07:2015-12", "2015-01:2016-06"]
causal_chain:
  - {from: 老龄化与高储蓄, to: 总需求, sign: "-", lag: "持续", mechanism: "高收入家庭和老年人边际消费倾向低"}
  - {from: 资产去泡沫, to: 家庭财富, sign: "+", lag: "0-84月", mechanism: "估值扩张停止并回落（覆盖项把美股价格漂移每年下调 8 个百分点），市价/股息七年降到 81 倍左右"}
  - {from: 家庭财富, to: 消费, sign: "+", lag: "6-24月", mechanism: "负财富效应拖累消费"}
  - {from: 企业去杠杆, to: 资本开支, sign: "-", lag: "0-24月", mechanism: "AI 投资周期结束，企业偿债而不投资"}
  - {from: 总需求, to: 通胀, sign: "+", lag: "6-24月", mechanism: "需求不足使通胀降到 2% 以下"}
  - {from: 通胀, to: 政策利率, sign: "+", lag: "0-12月", mechanism: "美联储两年降到 1.4% 左右，七年降到 1% 附近"}
  - {from: 政策利率, to: 长期国债收益率, sign: "+", lag: "0-84月", mechanism: "10 年期两年降到 3.5% 左右、七年降到 2.2% 左右，长债获得资本利得"}
  - {from: 低利率与低增长, to: 银行盈利, sign: "-", lag: "12-60月", mechanism: "净息差收窄，金融股承压"}
phases:
  - name: 去杠杆与降息
    months: 24
    views:
      - {var: f_ff, mean_annual: -1.5, why: "挑选降息的月份（2001-03 年每年约 −1.8）"}
      - {var: s_cpi_yoy, mean: 1.5, why: "2009-15 年约 1.5%，2001-03 年约 2%"}
      - {var: f_y10, mean_annual: -0.6, why: "长端收益率下行（2001 年初到 2003 年年中每年约 −0.6）"}
      - {var: s_ip_yoy, mean: 0.0, why: "工业产出停滞"}
      - {var: f_unrate, mean_annual: 0.6, vol_mult: 0.7, why: "失业率缓慢上升；波动约束（约为不含 2020 年时月度波动的 1.1 倍）排除 2020 年 4 月这类单月 +10 个百分点的封锁月份"}
      - {var: f_capex_share, mean_annual: -0.3, why: "资本开支周期结束"}
    overrides:
      r_star: -0.5
      asset_drift: {us_equity: -0.08, nasdaq: -0.08, real_estate: -0.06, financials: -0.06}
    confidence: 1.0
  - name: 长期停滞
    months: 60
    views:
      - {var: s_cpi_yoy, mean: 1.2, why: "通胀长期偏低（日本 1995-2012 年约 0%）"}
      - {var: s_ip_yoy, mean: 0.5, why: "增长低迷"}
    overrides:
      r_star: -1.0
      asset_drift: {us_equity: -0.08, nasdaq: -0.08, real_estate: -0.06, financials: -0.06}
    confidence: 1.0
  - name: 回归常态
    months: 96
    views: []
