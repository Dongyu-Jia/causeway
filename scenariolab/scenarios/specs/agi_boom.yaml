id: agi_boom
name: AGI 全面实现：资本开支狂潮 → 劳动替代 → 生产率红利
summary: AI 资本开支先狂飙三年，随后大规模替代白领劳动、劳动收入占比下降，最终带来比 1990 年代后期更强、更持久的生产率红利和低通胀增长；模拟路径隐含的美股估值先回落、期末略高于 2000 年泡沫顶点。
narrative: |-
  第一阶段（三年）是资本开支狂潮：数据中心、芯片、电力和电网投资继续扩张，资本开支占 GDP 每年再升约 0.35 个百分点，视图挑选工业产出同比约 4%、劳动生产率增速约 2.8% 的月份（模拟的工业产出每年增长约 2.8%），失业率维持在 4% 左右，强劲的投资需求让联邦基金利率升到 5.7% 左右——这和 1995-99 年的科技繁荣（工业产出 +5.4%、生产率 2.5%、CPI 2.4%）最像。
  第二阶段（四年）是劳动替代：AI 代理接管大量白领任务，“人员收入对宏观经济的影响”计算器按收入 50-90% 组劳动收入累计 −8%、前 10% 组 −3%、后 50% 组 −2% 和股票财富继续上涨计算，劳动收入渠道使消费下降约 1.4%，财富效应使消费增加约 3%，白领失业使失业率累计上升约 2.25 个百分点（奥肯部分抵消约 0.6），劳动收入占比累计下降约 6.5%；需求效应转成该阶段的工业产出、服务通胀和失业率趋势视图，白领失业和劳动收入占比的直接效应在历史上没有对应月份，作为有界的因子漂移叠加到抽到的月份上，模拟的失业率四年从 4% 升到 5.4% 左右。
  第三阶段（八年）是生产率红利，但视图的置信度只有 0.5（一半权重留给历史常态，表达长期红利的不确定性）：抽到的月份生产率增速约 2.2%、通胀约 3%。
  美国历史上没有 AGI，生产率红利超出了历史支撑，所以除了计算器给出的白领失业和劳动收入占比漂移，这是本情景唯一的覆盖项：第二、三阶段给工业产出每年额外 +1.5% 和 +1%，模拟的工业产出在这两个阶段每年分别增长约 4.2% 和 3%；股票不另设漂移。
  其余一切（利率、通胀、信用、各资产的残差）都来自被视图加权的历史月份，主要是 1995-2000 年、1980-90 年代的去通胀扩张和 2000 年代中期、2010 年代的低通胀扩张；这些月份本身带着估值扩张（第一阶段每年约 +4%），但引擎只保留一半残差、资本市场假设又把美股的价格漂移每年下调约 3 个百分点，所以模拟路径隐含的美股市价/股息比前三年先回落到约 92 倍、第七年回到约 98 倍、期末约 106 倍，略高于 1973 年以来的最高值（2000 年 3 月约 102 倍）。
  风险在于第一阶段的估值和利率：如果生产率红利来得比资本开支晚，情景会滑向“AI 泡沫破裂”。
tags: [AI, AGI, 生产率, 资本开支, 劳动替代]
prior_prob: 0.06
analogs: ["1995-01:1999-12", "2003-06:2006-12"]
calibration:
  kind: distribution
  phase: 1
  params:
    labor_income_shock: {bottom50: -0.02, mid40: -0.08, top10: -0.03}
    equity_wealth_change: 0.40
causal_chain:
  - {from: AGI 突破, to: AI 资本开支, sign: "+", lag: "0-36月", mechanism: "数据中心、芯片和电力投资继续扩张，资本开支占 GDP 每年再升约 0.35 个百分点"}
  - {from: AI 资本开支, to: 工业产出, sign: "+", lag: "0-12月", mechanism: "设备、电力和建筑需求，工业产出每年增长约 2.8%"}
  - {from: 投资需求, to: 政策利率, sign: "+", lag: "0-36月", mechanism: "需求强劲、失业率维持在 4% 左右，联邦基金利率升到 5.7% 左右"}
  - {from: AI 代理, to: 白领劳动需求, sign: "-", lag: "24-84月", mechanism: "大量白领任务被替代，中层收入累计约 −8%，失业率四年升到 5.4% 左右"}
  - {from: 白领劳动需求, to: 劳动收入占比, sign: "+", lag: "12-48月", mechanism: "劳动收入占比四年再降约 6.5%"}
  - {from: AI 利润, to: 高收入消费, sign: "+", lag: "0-48月", mechanism: "股票财富上涨，财富效应使消费增加约 3%，撑住高收入消费"}
  - {from: AI 代理, to: 劳动生产率, sign: "+", lag: "24-120月", mechanism: "生产率增速升到 2.5-3%"}
  - {from: 劳动生产率, to: 通胀, sign: "-", lag: "12-60月", mechanism: "单位劳动成本下降，劳动替代期通胀约 2.6%"}
  - {from: 劳动生产率, to: 实际增长, sign: "+", lag: "持续", mechanism: "超出历史支撑的部分用工业产出漂移覆盖表达"}
phases:
  - name: 资本开支狂潮
    months: 36
    views:
      - {var: s_ip_yoy, mean: 4.0, why: "1995-99 年工业产出同比约 5.4%，今天制造业占比更低，下调"}
      - {var: f_capex_share, mean_annual: 0.35, why: "1995-99 年资本开支占 GDP 每年约 +0.36 个百分点"}
      - {var: s_productivity_yoy, mean: 2.8, why: "1995-99 年生产率增速约 2.5%"}
      - {var: s_cpi_yoy, mean: 3.0, why: "投资需求强劲，通胀从 3.7% 回落到 3% 左右"}
      - {var: s_unrate, mean: 4.2, why: "劳动力市场仍紧"}
    confidence: 1.0
  - name: 劳动替代
    months: 48
    views:
      - {var: s_productivity_yoy, mean: 3.0, why: "替代带来生产率加速"}
      - {var: s_cpi_yoy, mean: 2.2, why: "单位劳动成本下降，去通胀"}
      - {var: f_profit_share, mean_annual: 0.4, why: "利润占 GDP 上升"}
    overrides:
      factor_drift: {ip: 0.015}
    confidence: 1.0
  - name: 生产率红利
    months: 96
    views:
      - {var: s_productivity_yoy, mean: 2.5, why: "生产率增速维持在 2.5% 左右"}
      - {var: s_cpi_yoy, mean: 2.3, why: "低通胀增长"}
    overrides:
      factor_drift: {ip: 0.01}
    confidence: 0.5
