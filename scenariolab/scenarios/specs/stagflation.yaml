id: stagflation
name: 滞胀回归：1970 年代式工资-物价螺旋
summary: 油价、关税和宽松的政策叠加，通胀预期脱锚、工资与物价相互推升，CPI 在 6.5-7% 维持四年（按引擎的体制定义大多是没有收缩的通胀）；螺旋期里股票和长债的实际回报为负、黄金和能源占优，之后被迫沃尔克式紧缩，经济陷入通胀仍高的滞胀式衰退，失业率升到 7% 左右。
narrative: |-
  起点已经有滞胀的火种：油价同比 +54%、商品通胀 4.6%、CPI 从年初的 2.4% 升到 3.7%，而实际政策利率接近零，消费者信心只有 48。
  如果美联储在财政和政治压力下继续容忍，通胀预期会脱锚：企业按预期提价、工人要求补偿，工资与物价互相推升；螺旋期把政策规则的中性实际利率覆盖为 −1%（央行落后于曲线）。
  历史上的 1973-75 年和 1977-81 年 CPI 平均约 9.5%、实际工资同比约 −1.9%，1973-78 年的实际政策利率平均约 −0.5%；今天经济的石油强度只有 1970 年代的一半左右、工会化率低、劳动收入占比处在历史低位，所以视图按比例下调：挑选 CPI 约 7%、实际工资同比约 −1%、实际政策利率约 −1.5%、油价每年涨约 15% 的月份，模拟的 CPI 一年内升到 7% 左右并在 6.5% 上下维持四年，实际政策利率约 −1%，油价四年涨到 175 美元左右。
  这一阶段权重集中在 1970 年代和 2021-22 年的月份，股票的实际回报为负、债券被通胀侵蚀，黄金和能源相对占优，10 年期收益率四年升到 8% 左右；按引擎的体制定义（收缩 = 工业产出从高点回落 3% 以上且失业率上升，滞胀 = 收缩期间 CPI 同比平均高于 4%），这四年里约 60% 的模拟月份是没有收缩的通胀（像 1977-79 年），约 26% 是螺旋中途出现收缩、通胀仍高的滞胀（像 1973-75 年），所以阶段名写的是高通胀。
  四年后被迫进行沃尔克式紧缩（1979-82 年类比）：中性实际利率上调到 3%，并且整个情景里政策利率向规则收敛的速度从默认的每月 2% 提高到 8%，表达央行先容忍、后被迫追赶；紧缩的头半年视图挑选联邦基金利率每年上升约 4 个百分点、CPI 约 6.5% 的月份（权重最高的是 1979-81 年），政策利率半年内从 6% 左右升到 8.2% 左右，实际政策利率从螺旋期末的约 −0.5% 升到 2% 左右。
  接着是一年的滞胀式衰退：视图多抽收缩期间通胀仍高于 4% 的月份（宏观体制：滞胀占抽中月份的 65%，其中约 55% 来自 1981-82 年、约 30% 来自 1973-75 年，其余主要是 1990-91 年），并让失业率每年升约 2 个百分点，模拟路径里这一年约 57% 的月份是滞胀，失业率升约 1.9 个百分点（到 6.9% 左右），通胀从 6.3% 左右回落到 4.6% 左右，政策利率在紧缩期末见顶、随通胀回落到 6.5% 左右；与这一阶段重叠的收缩里约 37% 长于 18 个月（引擎无条件抽样同一时段约 35%，1973 年以来的 7 次收缩没有一次长于 18 个月）。
  紧缩之后引擎回到无视图的历史常态：收益率回落，长债反而迎来很高的回报（类似 1982 年以后），但 15 年的平均通胀（约 4.6%）和股票实际回报都留下了这段螺旋的痕迹，模拟路径隐含的市价/股息比也从 97 倍降到 68 倍左右。
tags: [滞胀, 通胀, 工资-物价螺旋, 紧缩]
prior_prob: 0.07
analogs: ["1973-10:1975-03", "1977-01:1980-03", "1980-04:1982-11", "2021-06:2022-12"]
causal_chain:
  - {from: 油价与关税, to: 商品通胀, sign: "+", lag: "0-6月", mechanism: "能源和进口成本直接推高商品价格，油价每年再涨约 15%"}
  - {from: 商品通胀, to: 通胀预期, sign: "+", lag: "3-12月", mechanism: "政策容忍使家庭和企业把高通胀当成常态"}
  - {from: 通胀预期, to: 名义工资, sign: "+", lag: "6-18月", mechanism: "工人要求补偿，名义工资每年涨约 6%，实际工资仍下降约 1%"}
  - {from: 名义工资, to: 服务通胀, sign: "+", lag: "3-12月", mechanism: "服务业成本以人工为主，工资直接传导，CPI 升到 7% 左右"}
  - {from: 实际政策利率为负, to: 通胀预期, sign: "+", lag: "持续", mechanism: "实际利率约 −1%，货币条件宽松"}
  - {from: 高通胀, to: 股票估值, sign: "-", lag: "0-24月", mechanism: "通胀抬高折现率并压缩利润率，1970 年代股债正相关"}
  - {from: 沃尔克式紧缩, to: 失业率, sign: "+", lag: "6-18月", mechanism: "中性实际利率上调到 3%，政策利率半年内升到 8% 以上，随后一年的滞胀式衰退使失业率升约 1.9 个百分点（到 7% 左右）"}
  - {from: 沃尔克式紧缩, to: 通胀, sign: "-", lag: "6-18月", mechanism: "需求收缩后通胀从 6.5% 左右回落到 4.6% 左右"}
phases:
  - name: 工资-物价螺旋（高通胀）
    months: 48
    views:
      - {var: s_cpi_yoy, mean: 7.0, why: "1973-75/1977-81 年 CPI 平均约 9.5%；今天石油强度减半、工会弱，按比例下调"}
      - {var: s_real_wage_yoy, mean: -1.0, why: "名义工资每年约 6%、追不上 7% 的通胀，实际工资同比约 −1%（1973-81 年约 −1.6%）"}
      - {var: s_real_ff, mean: -1.5, why: "政策落后于曲线，实际政策利率为负（1973-78 年平均约 −0.5%，1974-75 年低至 −5%）"}
      - {var: f_oil, mean_annual: 0.15, why: "油价继续上行（1977-81 年每年约 +19%）"}
      - {var: s_ip_yoy, mean: 0.5, why: "1973-75 年工业产出同比平均约 −0.3%，1979-81 年约 +0.6%"}
    overrides:
      r_star: -1.0
    confidence: 1.0
  - name: 沃尔克式紧缩（通胀仍高）
    months: 6
    views:
      - {var: f_ff, mean_annual: 4.0, why: "政策利率快速上调：挑选联邦基金利率每年上升约 4 个百分点的月份（1979-10 至 1980-03 年每年约 +11.5，1980-08 至 1981-01 年约 +20），权重最高的是 1979-81 年"}
      - {var: s_cpi_yoy, mean: 6.5, why: "紧缩开始时通胀仍在 6.5% 左右"}
    overrides:
      r_star: 3.0
    confidence: 1.0
  - name: 滞胀式衰退
    months: 12
    # 12 months: 0.65 x 12 = 8 contraction months, and with the 6-month tightening before it the simulated
    # contractions stay about as long as the reference's (N5); 24 months of 滞胀 0.6 made 52% of the runs
    # overlapping the phase longer than 18 months (reference 29%)
    regime: {滞胀: 0.65}
    views:
      - {var: s_ip_yoy, mean: -3.0, why: "紧缩引发衰退：1980 年和 1981-82 年工业产出同比平均约 −2.5%；这些月份的失业率每年升 1 个百分点以上"}
      - {var: s_real_ff, mean: 2.0, why: "滞胀式衰退期的实际政策利率：1981-82 年平均约 5.6%，1973-75 年约 −1.6%，1990-91 年约 1.3%；取 2%，让抽中的滞胀月份不只来自 1981-82 年一段"}
      - {var: s_cpi_yoy, mean: 6.0, why: "通胀开始回落但仍高"}
      - {var: f_unrate, mean_annual: 2.0, vol_mult: 1.0, why: "失业率每年升约 2 个百分点（1981 年 9 月到 1982 年底从 7.6% 升到 10.8%，1973 年底到 1975 年 5 月从 4.9% 升到 9.0%）；同时让抽到月份的波动保持历史水平，否则均值视图会偏向 2020 年 4 月这类单月 +10 个百分点的封锁月份"}
    overrides:
      r_star: 3.0
    confidence: 1.0
  - name: 回归常态
    months: 114
    views: []
reversion:
  kappa_ff: 0.08
