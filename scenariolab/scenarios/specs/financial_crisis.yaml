id: financial_crisis
name: 系统性金融危机：2008 年式
summary: 私募信贷、商业地产和杠杆贷款的损失集中暴露，信用利差飙升、银行收缩信贷，估值和就业同步崩塌（失业率两年升到 7% 左右）；美联储把利率降到 1% 以下并长期维持。
narrative: |-
  今天的信用利差只有约 1.5 个百分点（BAA 减 10 年期），处在 1973 年以来最紧的一成（约 9% 分位），说明风险被定价得很便宜；与此同时，私募信贷、商业地产和杠杆贷款在高利率下积累了大量再融资压力。
  本情景假设某个节点（例如一批私募信贷基金赎回受限或商业地产违约集中爆发）引发连锁去杠杆：银行和非银机构同时收缩资产负债表，信用利差急升，全球美元荒推高美元，油价随需求崩塌。
  2007-12 到 2009-06 年的数据：信用利差均值约 4.1、峰值约 6，美元同比最高约 +20%，失业率每年升约 2.8 个百分点，工业产出同比约 −6.6%，美联储一年半把利率从 4.2% 降到接近零，CPI 从 4% 以上跌到负值。
  视图按危机的先后顺序放在根源变量上：第一年是利差、美元、油价、降息和信心（领先指标），并要求起点估值偏高（股息率约 1.6%）、失业率的月度波动保持历史水平（以免抽到 2020 年的封锁月份），第二年是产出、失业、继续降息和通缩压力（滞后指标）；引擎据此给 2008-09 年和 2001-02 年的危机月份更高权重，模拟中失业率两年从 4.2% 升到 7% 左右，政策利率降到 0.8% 左右，CPI 同比跌到 1.2% 左右，油价第一年跌约三成。
  那次股价下跌和估值压缩几乎全部来自宏观因子解释不了的部分，而引擎对抽到的历史月份只保留一半这种残差，所以前两年给美股大盘、纳斯达克、金融股和房地产各加每年 −8%（覆盖项上限）的价格漂移：模拟路径隐含的市价/股息比一年多内从 97 倍降到 73 倍左右、第二年末约 79 倍（2007-09 年从约 60 倍降到 31 倍），去杠杆期随复苏回升到 96 倍左右；信用利差按今天偏紧的起点缩放，中位数只升到 2.4 左右，最坏一成的路径升到 4.6 以上。
  之后是两年半的去杠杆和低利率（2009-12 年类比，中性实际利率下调到 −1.5%，政策利率停在 0.7% 左右），最后回到无视图的历史常态；长期国债是这个情景里最好的避险资产。
tags: [金融危机, 信用, 衰退, 零利率]
prior_prob: 0.05
analogs: ["2007-12:2009-06", "1973-11:1975-03", "2020-02:2020-06"]
causal_chain:
  - {from: 私募信贷与商业地产损失, to: 金融机构资本, sign: "-", lag: "0-6月", mechanism: "再融资失败和资产减值侵蚀资本"}
  - {from: 金融机构资本, to: 信贷供给, sign: "+", lag: "0-6月", mechanism: "资本不足迫使去杠杆、收紧放贷"}
  - {from: 信贷供给, to: 信用利差, sign: "-", lag: "0-12月", mechanism: "风险溢价急升（2008 年升到 4 个百分点以上；引擎按今天 1.5 的起点缩放，模拟中位数升到 2.4 左右，最坏一成的路径升到 4.6 以上）"}
  - {from: 信用利差, to: 企业投资与就业, sign: "-", lag: "3-24月", mechanism: "融资成本跳升，企业裁员和削减投资，失业率两年升到 7% 左右"}
  - {from: 资产价格下跌, to: 家庭消费, sign: "+", lag: "3-12月", mechanism: "股票和房产财富缩水，负财富效应；市价/股息一年多内降到 73 倍左右"}
  - {from: 失业率, to: 政策利率, sign: "-", lag: "0-24月", mechanism: "美联储两年内把利率从 3.75% 降到 0.8% 左右并重启 QE"}
  - {from: 需求崩塌, to: 通胀, sign: "+", lag: "6-18月", mechanism: "通胀跌到 1.2% 左右"}
  - {from: 低利率, to: 长期国债价格, sign: "+", lag: "0-36月", mechanism: "收益率下行和避险需求推高长债，10 年期收益率四年半降到 2.5% 左右"}
phases:
  - name: 信用收缩与恐慌
    months: 12
    views:
      - {var: f_spread, mean_annual: 1.5, why: "信用利差急升（2008 年一年约 +3 个百分点）"}
      - {var: s_spread, mean: 3.0, why: "利差升到 3 个百分点以上（2008 年均值约 3.9）"}
      - {var: f_usd, mean_annual: 0.10, why: "全球美元荒，避险推高美元（2008-09 年同比最高约 +20%）"}
      - {var: f_oil, mean_annual: -0.5, why: "需求崩塌，油价下跌（2008 年下半年跌约 70%）"}
      - {var: f_ff, mean_annual: -2.5, why: "紧急降息，一年把 3.75% 降到 1.5% 附近"}
      - {var: f_sentiment, mean_annual: -15.0, why: "消费者信心崩溃"}
      - {var: s_div_yield, mean: 1.6, why: "危机从高估值出发：挑选股息率约 1.6% 的月份（今天约 1.0%，2000 年约 1.0%，2007 年约 1.6%），而不是 1973-74、1981-82 年股息率 4-6% 的衰退"}
      - {var: f_unrate, vol_mult: 1.0, why: "利差急升、油价暴跌、紧急降息和信心崩溃也正是 2020 年 3 月的样子：不加约束时约 6% 的路径在这一阶段抽到 2020 年 4 月这类单月 +10 个百分点的封锁月份；这里约束抽到月份的失业率波动保持历史水平"}
    overrides:
      # valuation compression beyond what the drawn months carry: the 2007-11..2009-02 fall was almost all residual
      # (unexplained by the ten factors: us_equity -0.60 log, financials -1.07, real estate -0.69 in 16 months) and the
      # engine keeps half of a drawn month's residual (config.RESIDUALS); -0.08 is the bound (schema.ASSET_DRIFT_BOUND)
      asset_drift: {us_equity: -0.08, nasdaq: -0.08, financials: -0.08, real_estate: -0.08}
    confidence: 1.0
  - name: 衰退见底
    months: 12
    views:
      - {var: s_ip_yoy, mean: -6.0, why: "2008-09 年工业产出同比约 −6.6%（2009 年中低至 −15%）"}
      - {var: f_unrate, mean_annual: 2.0, vol_mult: 1.0, why: "失业率一年升约 2 个百分点（2008-09 年每年约 +2.8）；同时让抽到月份的波动保持历史水平，否则均值视图会偏向 2020 年 4 月这类单月 +10 个百分点的封锁月份"}
      - {var: f_ff, mean_annual: -1.5, why: "继续降息到接近零（2008 年下半年、2001 年）"}
      - {var: s_spread, mean: 3.6, why: "利差处在高位（2009 年初约 5-6）"}
      - {var: s_cpi_yoy, mean: 1.0, why: "通胀跌到 1% 左右，短暂通缩"}
    overrides:
      asset_drift: {us_equity: -0.08, nasdaq: -0.08, financials: -0.08, real_estate: -0.08}
    confidence: 1.0
  - name: 去杠杆与零利率
    months: 30
    views:
      - {var: s_ff, mean: 0.3, why: "零利率（2009-15 年、2020-21 年）"}
      - {var: s_unrate, mean: 8.0, why: "2009-12 年失业率约 8-9%"}
      - {var: s_cpi_yoy, mean: 1.6, why: "低通胀（2009-12 年平均约 1.6%）"}
      - {var: s_spread, mean: 3.0, why: "利差从高位缓慢回落"}
      - {var: f_unrate, mean_annual: 0.0, vol_mult: 0.62, why: "去杠杆期失业率居高不下；波动约束（不含 2020 年时的月度波动）排除 2020 年 4 月这类单月 +10 个百分点的封锁月份，让类比落在 2009-12 年"}
    overrides:
      r_star: -1.5
    confidence: 1.0
  - name: 回归常态
    months: 126
    views: []
