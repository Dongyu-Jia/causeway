id: dollar_decline
name: 美元霸权衰落
summary: 财政赤字、制裁外溢和储备多元化让外国央行持续减持美元资产，美元三年贬值约 20%、期限溢价上升，10 年期收益率升到 5.7% 左右，黄金和实物资产重估。
narrative: |-
  起点：金价在过去两年里大幅上涨、2026 年初创出历史新高，说明各国央行已经在用黄金替代部分美元储备；10 年期收益率 5.3%、期限利差 1.5 个百分点，期限溢价在上升（纽约联储 ACM 估计约 0.9 个百分点）。
  本情景假设这一趋势加速：制裁风险和美国财政前景让外国官方部门减持美国国债，贸易结算更多使用其他货币，美元三年贬值约 20%。
  历史上美元的大幅贬值有 1985-87 年广场协议（每年约 −17%）、1977-78 年美元危机（每年约 −8%）和 2002-07 年（每年约 −6%）；那时美元的储备地位没有真正动摇，本情景取中间偏强的幅度。
  视图挑选美元每年贬值约 8% 的月份，权重最高的是 1985-87 年广场协议之后、2002-07 年和 1990 年的月份，美元贬值通过进口价格让通胀维持在 3.7% 左右；只按美元挑选时这些月份的期限溢价和长期收益率都在下降，所以“外国买家减少、期限溢价上升”用缺失因子审计新增的 10 年期限溢价（ACM）表达：视图同时挑选期限溢价每年上升约 0.3 个百分点的月份，10 年期收益率三年内升到 5.7% 左右；这些月份过后引擎会把 10 年期拉回“中性利率 + 通胀 + 0.75 个百分点期限溢价”，期限溢价长期抬高这一部分历史撑不起来，所以仍用覆盖项表达：期限溢价覆盖为 1.25 个百分点（历史默认 0.75），10 年期收益率此后一直在 5.5% 以上。
  第二阶段是多极货币体系的“新常态”：美元每年继续贬值约 3%，期限溢价每年再升约 0.1 个百分点，通胀略高于 3%。
  受益的是黄金（模型中黄金对美元的弹性约 −0.7）、能源和海外收入占比高的跨国公司；受损的是美元贬值期间的长期美债（前三年总回报中位数约 14%，基准情景约 21%）和美元现金的国际购买力。最后回到无视图的历史常态，但期限溢价覆盖在整个 15 年里都有效，所以 10 年期收益率期末约 5.8%（基准情景约 5.2%）。
tags: [美元, 储备货币, 黄金, 期限溢价]
prior_prob: 0.05
analogs: ["1985-03:1987-12", "1977-01:1978-10", "2002-02:2007-12"]
causal_chain:
  - {from: 制裁风险与财政前景, to: 外国官方需求, sign: "-", lag: "0-24月", mechanism: "外国央行减持美国国债、增持黄金"}
  - {from: 外国官方需求, to: 美元, sign: "+", lag: "0-12月", mechanism: "美元三年贬值约 20%，之后每年约 −3%"}
  - {from: 外国官方需求, to: 期限溢价, sign: "-", lag: "0-24月", mechanism: "边际买家减少：视图挑选期限溢价每年上升约 0.3 个百分点的月份，期限溢价覆盖为 1.25 个百分点，10 年期收益率三年升到 5.7% 左右、之后一直在 5.5% 以上"}
  - {from: 美元, to: 进口价格, sign: "-", lag: "3-12月", mechanism: "美元贬值推高进口商品价格"}
  - {from: 进口价格, to: CPI 通胀, sign: "+", lag: "3-12月", mechanism: "通胀维持在 3.7% 左右"}
  - {from: 美元, to: 黄金, sign: "-", lag: "0-6月", mechanism: "模型中黄金对美元的弹性约 −0.7"}
  - {from: 美元, to: 跨国公司盈利, sign: "-", lag: "0-12月", mechanism: "海外收入换算成美元后增加"}
  - {from: 期限溢价, to: 长期国债价格, sign: "-", lag: "0-12月", mechanism: "收益率上行带来资本损失"}
phases:
  - name: 美元贬值
    months: 36
    views:
      - {var: f_usd, mean_annual: -0.08, why: "美元每年约 −8%（1985-87 年每年 −17%，1977-78 年 −8%，2002-07 年 −6%）"}
      - {var: s_cpi_yoy, mean: 3.8, why: "进口价格推高通胀"}
      - {var: f_tp10, mean_annual: 0.3, why: "外国官方买家减少：挑选 10 年期限溢价（ACM）每年上升约 0.3 个百分点的月份；只按美元挑选时这些月份的期限溢价每年下降约 0.1、长端收益率每年下降约 0.3"}
    confidence: 1.0
  - name: 多极货币体系
    months: 60
    views:
      - {var: f_usd, mean_annual: -0.03, why: "美元继续缓慢贬值，每年约 −3%"}
      - {var: s_cpi_yoy, mean: 3.3, why: "通胀略高于 3%"}
      - {var: f_tp10, mean_annual: 0.1, why: "期限溢价继续缓慢上升（每年约 +0.1 个百分点）"}
    confidence: 1.0
  - name: 回归常态
    months: 84
    views: []
# The f_tp10 views draw the months that carry the rise of the term premium while the dollar falls. After them the
# engine draws unconditional months and pulls the 10-year back toward r* + inflation + 0.75, so the lasting part of
# the rise, which history cannot carry, stays an override: a term premium of 1.25 in the 10-year's anchor (the spec
# before the content review had 1.75 and kappa_y10 0.03)
reversion:
  term_premium: 1.25
