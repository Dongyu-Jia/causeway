id: oil_war
name: 中东战争与石油供给冲击
summary: 战事升级导致霍尔木兹海峡航运受阻，油价半年内再涨约 45%、接近 140 美元，通胀冲到 5% 以上、消费者信心下滑；之后油价回落约两成，失业率升到 5.7% 左右，经济留下温和衰退的伤痕。
narrative: |-
  今天的油价已经是一次供给冲击的产物：同比 +54%、约 97 美元，2026 年 4 月同比一度超过 80%。
  本情景假设冲突升级、霍尔木兹海峡航运受阻，全球约五分之一的海运原油受威胁，油价在 6 个月内再涨约 45%，接近 140 美元。
  冲击期的视图放在根因上：油价涨幅和识别出的石油供给冲击（油价涨、产出跌、物价涨），再用消费者信心下滑和产出停滞排除 1999、2009、2021 年那类需求复苏推动的油价上涨；权重最高的是 1990 年海湾战争和 1973-74 年禁运的月份，模拟的 CPI 同比在半年内从 3.7% 升到 5% 左右，通胀不需要另设视图。
  这些冲击都在历史经验之内，所以整个情景只用视图、不用覆盖项：引擎按 6 个月区块给历史月份重新赋权，被抽中的月份本身就带来约 45% 的油价涨幅。
  海峡重新开放后，供给恢复和需求破坏让油价在一年半里回落约两成，到 105-110 美元；高油价挤压实际收入和企业利润，失业率在冲击期已升约 0.4 个百分点，之后一年半再升约 1.0，到 5.7% 左右，工业产出收缩、信用利差从 1.5 升到 2 左右，形成类似 1974-75 年和 1990-91 年但更温和的衰退。
  能源股和原油在冲击期领先；衰退期之后引擎回到无视图的历史常态，实际油价随均值回归继续缓慢回落。
tags: [石油, 战争, 供给冲击, 滞胀]
prior_prob: 0.09
analogs: ["1973-10:1975-03", "1979-01:1980-06", "1990-08:1991-03", "2022-02:2022-10"]
causal_chain:
  - {from: 霍尔木兹海峡受阻, to: 原油供给, sign: "-", lag: "0-1月", mechanism: "约五分之一的海运原油受威胁，库存和战略储备只能部分对冲"}
  - {from: 原油供给, to: 油价, sign: "-", lag: "0-6月", mechanism: "短期需求缺乏弹性，油价 6 个月再涨约 45%、接近 140 美元"}
  - {from: 油价, to: 通胀, sign: "+", lag: "0-6月", mechanism: "汽油、运输和石化成本直接进入物价，CPI 同比半年内升到 5% 左右"}
  - {from: 油价, to: 实际收入, sign: "-", lag: "0-6月", mechanism: "能源账单挤占家庭其他支出，消费者信心进一步下滑"}
  - {from: 油价, to: 能源股, sign: "+", lag: "0-3月", mechanism: "能源企业利润随油价上升"}
  - {from: 实际收入, to: 失业率, sign: "-", lag: "3-24月", mechanism: "消费和投资收缩，失业率两年升约 1.5 个百分点，到 5.7% 左右"}
  - {from: 供给恢复与需求破坏, to: 油价, sign: "-", lag: "6-24月", mechanism: "海峡重开后油价一年半回落约两成"}
  - {from: 衰退, to: 信用利差, sign: "+", lag: "6-24月", mechanism: "企业盈利下滑，信用利差从 1.5 升到 2 左右"}
phases:
  - name: 冲击期
    months: 6
    views:
      - {var: f_oil, mean_annual: 0.74, why: "海峡受阻：油价半年累计上涨约 0.37 个对数单位（约 +45%），1973-74、1979、1990 年都有半年 +40% 以上的涨幅"}
      - {var: e_oil_supply, mean: 0.5, why: "石油供给冲击（SVAR 识别：油价涨、产出跌、物价涨）偏正的月份，例如 1973-74 年和 1990 年"}
      - {var: f_sentiment, mean_annual: -16.0, why: "油价冲击期消费者信心半年下降约 8 点（1990 年 7-10 月约 −25 点）"}
      - {var: s_ip_yoy, mean: 0.5, why: "供给冲击压低产出：排除 1999、2009、2021 年那类需求复苏推动、产出同时走强的油价上涨"}
    confidence: 1.0
  - name: 衰退与油价回落
    months: 18
    views:
      - {var: f_oil, mean_annual: -0.24, why: "海峡重开、供给恢复：挑选油价回落的月份（2008 年下半年、1980-82 年、1990-91 年战后），一年半平均累计约 −0.36 个对数单位（约 −30%）；2008 年下半年那类暴跌区块把均值拉低，中位数路径约 −0.23（回落约两成）"}
      - {var: f_unrate, mean_annual: 0.8, vol_mult: 1.0, why: "温和衰退：失业率每年升约 0.8 个百分点（1974-75 年约 3、1990-91 年约 1.5）；同时让抽到月份的波动保持历史水平，否则均值视图会偏向 2020 年 4 月这类单月 +10 个百分点的封锁月份"}
      - {var: s_ip_yoy, mean: -1.5, why: "1974-75 年工业产出同比平均约 −4.5%（谷底约 −12%），1990-91 年约 −0.3%（谷底约 −3.6%），按温和衰退取 −1.5%"}
      - {var: s_cpi_yoy, mean: 4.5, why: "油价回落后通胀从高点下降但仍高于目标，偏向 1974-75、1980-82 年这类油价冲击后的衰退月份"}
    confidence: 1.0
  - name: 回归常态
    months: 156
    views: []
