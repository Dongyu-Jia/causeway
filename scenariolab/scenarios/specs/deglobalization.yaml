id: deglobalization
name: 去全球化与关税战
summary: 关税全面升级、盟友和对手同步报复，商品通胀抬升、贸易和工业产出受压；之后转为高成本的供应链回流，增长温和但通胀中枢更高。
narrative: |-
  起点：商品通胀已经从年初的 1% 升到 4.6%，一部分来自油价，一部分来自 2025 年以来的关税；有效关税率处于 1930 年代以来的最高水平。
  本情景假设关税继续升级并引发全面报复：进口商品价格上涨、跨国企业推迟投资、出口订单下降，工业产出停滞，消费者信心停在低位。
  可比的历史有 2018-19 年贸易战（工业产出同比从 2018 年的约 4% 降到 2019 年的约 −1%、制造业衰退）和 2021-22 年供应链危机（商品通胀约 10%）；关税对商品价格的传导按约 15% 的有效关税、进口约占商品消费三分之一估算；模拟的商品通胀第一年升到 6% 左右、两年平均约 5%（比关税前的约 1% 高约 4 个百分点），CPI 升到 4.5% 左右。
  第二阶段是“回流”：企业把产能搬回北美或友岸国家，资本开支占 GDP 上升，但效率更低，劳动生产率增速只有约 1%，通胀中枢比全球化时代高；美联储把关税和回流成本当作相对价格变化，容忍略高的通胀（中性实际利率覆盖为 0.25%）。
  引擎在第一阶段给 2008 年、2011 年、2021-22 年和 2025-26 年这类商品通胀高、产出疲弱、信心低迷的月份更高权重，模拟的工业产出两年停滞、失业率升到 4.8% 左右，抽到的 2021-22 年加息月份按今天的利率水平放大后，10 年期收益率两年升到 6% 左右；第二阶段偏向资本开支上升、生产率偏低的月份（以 2010 年代为主），通胀回到 3% 左右，失业率回落到 4.2% 左右。
  关税战期间股票整体承压（工业股与大盘同跌），能源和黄金等实物资产相对受益，模拟路径隐含的市价/股息比两年降到 76 倍左右、15 年后约 59 倍；最后回到无视图的历史常态。
tags: [关税, 去全球化, 供应链, 商品通胀]
prior_prob: 0.07
analogs: ["2018-03:2019-12", "2021-03:2022-09", "1977-01:1979-12"]
causal_chain:
  - {from: 关税升级, to: 进口商品价格, sign: "+", lag: "0-6月", mechanism: "约 15% 的有效关税，进口约占商品消费三分之一"}
  - {from: 进口商品价格, to: 商品通胀, sign: "+", lag: "1-12月", mechanism: "商品通胀两年平均约 5%，比关税前高约 4 个百分点"}
  - {from: 贸易报复, to: 出口与工业产出, sign: "-", lag: "3-12月", mechanism: "出口订单下降，制造业停滞（2018-19 年类比）"}
  - {from: 不确定性, to: 企业投资, sign: "-", lag: "0-12月", mechanism: "跨国企业推迟投资，等待政策落定"}
  - {from: 商品通胀, to: 实际收入, sign: "-", lag: "0-12月", mechanism: "家庭购买力下降，消费者信心低迷"}
  - {from: 供应链回流, to: 资本开支, sign: "+", lag: "12-48月", mechanism: "产能搬回北美和友岸国家"}
  - {from: 供应链回流, to: 劳动生产率, sign: "-", lag: "12-60月", mechanism: "放弃比较优势，单位成本上升"}
  - {from: 劳动生产率, to: 通胀中枢, sign: "-", lag: "持续", mechanism: "生产率低、成本高，通胀中枢比全球化时代高"}
phases:
  - name: 关税战升级
    months: 24
    views:
      - {var: s_goods_yoy, mean: 5.5, why: "今天 4.6%；关税传导再加约 1-2 个百分点（2021-22 年约 10%）"}
      - {var: s_ip_yoy, mean: 0.0, why: "2018-19 年贸易战期间工业产出同比从约 4% 降到 2019 年的约 −1%（整段平均约 1%），报复更全面时停滞"}
      - {var: s_services_yoy, mean: 3.5, why: "服务通胀基本稳定"}
      - {var: s_sentiment, mean: 62.0, why: "消费者信心处在低位（2022 年约 60）"}
      - {var: f_unrate, mean_annual: 0.3, why: "制造业和贸易相关就业走弱"}
    confidence: 1.0
  - name: 供应链回流
    months: 48
    views:
      - {var: f_capex_share, mean_annual: 0.25, why: "回流带动资本开支占 GDP 上升（1977-79 年每年约 +0.8）"}
      - {var: s_productivity_yoy, mean: 1.0, why: "效率损失，生产率增速约 1%（历史均值 1.9%）"}
      - {var: s_goods_yoy, mean: 3.0, why: "商品通胀回落但高于全球化时代的 1-2%"}
      - {var: s_cpi_yoy, mean: 3.3, why: "通胀中枢上移"}
      - {var: s_ip_yoy, mean: 1.5, why: "国内产能恢复，工业产出温和增长"}
    overrides:
      r_star: 0.25
    confidence: 1.0
  - name: 回归常态
    months: 108
    views: []
