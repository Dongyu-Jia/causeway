id: energy_transition
name: 能源转型与气候冲击
summary: 极端天气和气候政策推高能源、食品与保险成本，电网和清洁能源投资激增形成“绿色通胀”；之后石油需求见顶，油价五年回落约 19%，长期实际油价锚下移，能源股明显跑输。
narrative: |-
  转型的第一阶段是“绿色通胀”：化石能源的上游投资不足而需求尚未下降，叠加极端天气对农产品、电力和保险的冲击，能源价格更高也更不稳定；同时 AI 数据中心和电气化让电网、储能和发电投资激增，资本开支占 GDP 继续上升。
  可比的历史是 2021-22 年的能源紧缺和 2007-08 年的大宗商品超级周期：CPI 3.4-6.7%，商品通胀更高，油价每年上涨约 18-57% 且波动加大；本情景取温和得多的幅度。
  视图让油价每年上涨约 10%、波动放大 1.3 倍，资本开支上升，CPI 约 3.8%，失业率的月度波动保持在不含 2020 年时的水平（否则油价波动视图会把 2020 年春季的封锁月份抽进来）；模拟的油价三年涨到 134 美元左右，CPI 平均约 3.5%。
  第二阶段石油需求见顶：电动车和效率提升使原油需求结构性下降，视图挑选油价每年下跌约 4.5% 的月份（五年平均约 −20%），模拟的油价中位数五年回落约 19%、到 108 美元左右（类比 2014-16 年油价崩跌但温和得多），通胀回到 3% 以下；同时用有界覆盖把能源股价格漂移下调 2 个百分点（搁浅资产）、公用事业上调 1 个百分点（受监管的电网资产扩大）。
  美国历史上石油需求从未持续下降，引擎默认让没有油价视图的阶段把实际油价拉回 1973 年以来的中位数（约 68 美元，按今天的价格）；转型后这个锚不再适用，所以最后阶段把实际油价的长期锚下移约三成，到 1986-2003 年这个供给充裕、需求增长缓慢的时代的中位数（约 48 美元），模拟的实际油价 15 年后约 60 美元（名义约 98 美元），而不是关掉均值回归。
  油气资产明显跑输（搁浅资产风险）；公用事业在绿色通胀期相对抗跌，之后与大盘相当。
tags: [能源转型, 气候, 绿色通胀, 石油需求]
prior_prob: 0.05
analogs: ["2021-03:2022-09", "2007-01:2008-07", "2014-07:2016-02"]
causal_chain:
  - {from: 极端天气, to: 食品与保险价格, sign: "+", lag: "0-12月", mechanism: "农产品减产、灾害理赔推高保险费"}
  - {from: 上游投资不足, to: 油价, sign: "+", lag: "12-36月", mechanism: "需求未降而供给投资下降，油价三年涨到 134 美元左右，波动更大"}
  - {from: 电气化与数据中心, to: 电网与发电投资, sign: "+", lag: "0-36月", mechanism: "资本开支占 GDP 每年再升约 0.3 个百分点"}
  - {from: 油价与食品价格, to: CPI 通胀, sign: "+", lag: "0-6月", mechanism: "绿色通胀使 CPI 约 3.5%"}
  - {from: 电动车与效率, to: 石油需求, sign: "-", lag: "36-96月", mechanism: "石油需求见顶后结构性下降"}
  - {from: 石油需求, to: 油价, sign: "+", lag: "0-60月", mechanism: "需求下降使油价五年回落约 19%，长期实际油价锚下移到约 48 美元"}
  - {from: 油价, to: 能源股, sign: "+", lag: "0-6月", mechanism: "油气资产面临搁浅风险"}
  - {from: 电网投资, to: 公用事业盈利, sign: "+", lag: "12-60月", mechanism: "受监管的资产基础扩大"}
phases:
  - name: 绿色通胀
    months: 36
    views:
      - {var: f_oil, mean_annual: 0.10, vol_mult: 1.3, why: "上游投资不足，油价每年约 +10% 且波动更大"}
      - {var: f_capex_share, mean_annual: 0.3, why: "电网、储能和发电投资激增"}
      - {var: s_cpi_yoy, mean: 3.8, why: "介于 2007-08 年（约 3.4%）和 2021-22 年（约 6.7%）之间，按温和的绿色通胀取 3.8%"}
      - {var: s_goods_yoy, mean: 4.0, why: "能源和食品推高商品价格"}
      - {var: s_ip_yoy, mean: 1.5, why: "增长温和"}
      - {var: f_unrate, vol_mult: 0.62, why: "油价波动放大的视图会偏向 2020 年 3-5 月油价暴跌又暴涨的区块（不加约束时约 17% 的路径在这一阶段抽到 2020 年 4 月）；波动约束（不含 2020 年时的月度波动）排除这类单月 +10 个百分点的封锁月份"}
    confidence: 1.0
  - name: 石油需求见顶
    months: 60
    views:
      - {var: f_oil, mean_annual: -0.045, why: "石油需求结构性下降：油价每年约 −4.5%，五年约 −20%（2014-16 年的崩跌是每年 −40% 以上）"}
      - {var: s_cpi_yoy, mean: 2.7, why: "能源价格下降带来去通胀"}
      - {var: s_ip_yoy, mean: 2.0, why: "电气化投资支撑增长"}
    overrides:
      asset_drift: {energy: -0.02, utilities: 0.01}
    confidence: 1.0
  - name: 转型后的常态
    months: 84
    views: []
reversion:
  # phases without an oil view revert the real oil price toward its 1973+ median ($68 in 2026 dollars); after the
  # demand peak that anchor moves to the 1986-2003 median, about $48: log(48/68) = -0.35 (schema bounds -0.7..0.4)
  oil_target_shift: -0.35
