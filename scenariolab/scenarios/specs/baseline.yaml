id: baseline
name: 基准：当前状态延续后回归常态
summary: 油价的战争溢价在一年内回吐约一成，通胀缓慢回到 3% 附近，失业率四年缓慢升到 4.7% 左右、不衰退，之后回到历史常态分布。
narrative: |-
  起点（2026 年 9 月）：油价同比 +54%、约 97 美元，CPI 3.7%、商品通胀 4.6%，但核心通胀只有 2.6%；联邦基金利率 3.75%、10 年期 5.3%，信用利差只有 1.5 个百分点，失业率 4.2%，消费者信心 48 处于历史低位。
  基准假设没有新的大冲击：油价的战争溢价在一年内部分回吐（视图挑选油价每年回落约 10% 的月份，第一年油价回落约一成，到 88 美元左右），商品通胀随之回落；核心通胀不高、劳动收入占比处于历史低位说明工人议价能力弱，工资-物价螺旋难以形成。
  第一年延续今天的状态（CPI 约 3.4%、失业率约 4.3%、利差偏紧、工业产出温和增长），视图权重主要落在 2023 年以来的月份，其次是 1990 年代后期和 2010 年代这类“晚周期扩张”月份。
  随后三年逐步正常化：CPI 回到 3% 以下、信用利差从 1.5 升到 1.7-1.8；失业率视图挑选失业率约 4.6%、仍在缓慢上升的晚周期月份，模拟的失业率四年缓慢升到 4.7% 左右，接近 4.8% 的长期水平但不触发衰退。
  此后不再施加任何视图，引擎从 1973 年以来的全部历史月份抽样（2020 年封锁月份按 0.25 倍权重），即“历史常态”；利率按通胀加中性利率均值回归，实际油价缓慢回到 1973 年以来的中位数。
  高估值不靠视图处理：今天市价/股息约 97 倍、历史中位数约 52 倍，资本市场假设把美股的价格漂移每年下调约 3 个百分点，模拟路径隐含的市价/股息比 15 年后降到约 83 倍，所以即使在基准里美股的回报也低于历史平均。
tags: [基准, 软着陆, 均值回归]
prior_prob: 0.19
analogs: ["1996-01:2000-06", "2005-01:2007-06", "2017-01:2019-12", "2023-01:2026-09"]
causal_chain:
  - {from: 战争溢价消退, to: 油价, sign: "-", lag: "0-12月", mechanism: "供给担忧缓解，油价第一年回落约一成"}
  - {from: 油价, to: 商品通胀, sign: "+", lag: "1-6月", mechanism: "能源和运输成本传导到商品价格"}
  - {from: 商品通胀, to: CPI 通胀, sign: "+", lag: "0-3月", mechanism: "核心只有 2.6%，整体通胀随商品回落到 3% 附近"}
  - {from: 劳动收入占比低, to: 工资-物价螺旋, sign: "-", lag: "持续", mechanism: "工人议价能力弱，通胀难以自我强化"}
  - {from: CPI 通胀, to: 政策利率, sign: "+", lag: "3-12月", mechanism: "政策利率向中性实际利率 0.75% 加通胀缓慢收敛"}
  - {from: 劳动力市场降温, to: 失业率, sign: "+", lag: "6-48月", mechanism: "失业率四年缓慢升到 4.7% 左右，不触发衰退"}
  - {from: 信用利差, to: 企业融资成本, sign: "+", lag: "0-6月", mechanism: "利差从 1.5 升到 1.7-1.8，信用周期正常化"}
  - {from: 高估值, to: 股票长期回报, sign: "-", lag: "数年", mechanism: "市价/股息向中位数回归，资本市场假设每年下调约 3 个百分点"}
phases:
  - name: 当前状态延续
    months: 12
    views:
      - {var: s_cpi_yoy, mean: 3.4, why: "油价高位但不再上涨，商品通胀缓慢回落；核心 2.6%"}
      - {var: s_unrate, mean: 4.3, why: "劳动力市场温和降温，接近今天的 4.2%"}
      - {var: s_spread, mean: 1.7, why: "信用利差仍偏紧（今天 1.5）"}
      - {var: s_ip_yoy, mean: 1.5, why: "最近一年工业产出同比约 1.4%"}
      - {var: f_oil, mean_annual: -0.10, why: "战争溢价回吐：挑选油价每年回落约 10% 的月份"}
    confidence: 1.0
  - name: 逐步正常化
    months: 36
    views:
      - {var: s_cpi_yoy, mean: 2.9, why: "商品通胀回落后，整体通胀回到 3% 以下"}
      - {var: s_unrate, mean: 4.6, why: "接近自然失业率的晚周期月份"}
      - {var: f_unrate, mean_annual: 0.15, vol_mult: 0.62, why: "劳动力市场温和降温；波动约束（不含 2020 年时的月度波动）排除 2020 年 4 月这类单月 +10 个百分点的封锁月份"}
      - {var: s_spread, mean: 2.0, why: "信用利差回到长期中位数附近"}
      - {var: s_ip_yoy, mean: 2.0, why: "工业产出回到长期平均增速"}
    confidence: 1.0
  - name: 回归常态
    months: 132
    views: []
