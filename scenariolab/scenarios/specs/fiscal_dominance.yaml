id: fiscal_dominance
name: 财政主导与金融抑制：实际利率为负
summary: 赤字和利息支出失控，美联储在政治压力下降息、容忍 4% 以上的通胀，实际利率长期为负，现金持有人被“温和征税”（长债先有资本利得、之后实际收益为负），美元走弱、黄金走强。
narrative: |-
  起点：联邦赤字约占 GDP 6-7%，利息支出已超过国防开支；10 年期收益率 5.3%，而美联储在 CPI 3.7% 时仍把政策利率降到 3.75%，实际政策利率已经接近零。
  财政主导意味着货币政策服从于政府的融资需求：央行在通胀高于目标时继续降息，用资产购买和监管（例如要求银行多持有国债）压住长端，让债务/GDP 被通胀稀释。
  美国在 1946-51 年这样做过（实际利率约 −5%，不在本模型 1973 年以后的样本中）；样本内最接近的是 1974-75 年和 1980 年“通胀仍高却降息”的月份，以及 1977-78 年美元危机和 1985-86 年广场协议后的美元贬值期。
  前五年的视图挑选 CPI 约 4.8%、美元每年贬值约 3% 的月份（模拟的 CPI 在 4-4.6% 之间，美元五年贬值约 13%）；政策规则的中性实际利率覆盖为 −2.5%，即政策利率向“通胀减 2.5%”、10 年期向“通胀减 1.75%”收敛，模拟中政策利率五年降到约 2.8%、10 年期降到约 4.2%——这就是金融抑制，覆盖值超出了 1973 年以来美联储的常规行为。
  第一阶段没有用 2021-22 年做类比：那时实际利率虽然很负，但随后是历史上最快的加息，引擎按今天的利率水平放大这些加息后会得到与本情景相反的利率路径。
  随后四年逐步退出（中性实际利率 −1%、通胀降到 3.3% 左右），最后回到无视图的历史常态。受损的是现金的实际购买力，长债在收益率被压低时先有资本利得、之后实际收益为负；黄金和外币资产受益。
tags: [财政, 金融抑制, 负实际利率, 通胀, 美元]
prior_prob: 0.08
analogs: ["1974-06:1975-12", "1977-01:1978-10", "1979-10:1980-09", "1985-03:1986-12"]
causal_chain:
  - {from: 财政赤字与利息支出, to: 国债供给, sign: "+", lag: "持续", mechanism: "赤字约 GDP 6-7%，利息支出超过国防开支"}
  - {from: 国债供给, to: 政治压力, sign: "+", lag: "0-24月", mechanism: "高利率直接推高利息支出，政府施压央行降息"}
  - {from: 政治压力, to: 实际政策利率, sign: "-", lag: "0-12月", mechanism: "通胀高于目标时仍降息，实际利率转负"}
  - {from: 负实际利率, to: 通胀, sign: "+", lag: "6-24月", mechanism: "货币条件宽松，通胀维持在 4-4.6%"}
  - {from: 金融抑制, to: 长期收益率, sign: "-", lag: "0-24月", mechanism: "资产购买和监管要求压住长端，10 年期向通胀以下收敛，五年降到约 4.2%"}
  - {from: 负实际利率, to: 美元, sign: "-", lag: "0-24月", mechanism: "实际回报为负，资本外流，美元每年贬值约 3%"}
  - {from: 美元走弱, to: 黄金, sign: "+", lag: "0-12月", mechanism: "黄金是负实际利率和货币贬值的对冲"}
  - {from: 通胀高于利率, to: 债务/GDP, sign: "-", lag: "数年", mechanism: "名义 GDP 增长快于利息，债务被通胀稀释"}
phases:
  - name: 金融抑制
    months: 60
    views:
      - {var: s_cpi_yoy, mean: 4.8, why: "1974-80 年 CPI 约 6-12%；按今天更弱的工资议价下调到 4.8%"}
      - {var: f_usd, mean_annual: -0.03, why: "负实际利率下美元每年贬值约 3%（1977-78 年每年约 −8%）"}
    overrides:
      r_star: -2.5
    confidence: 1.0
  - name: 逐步退出
    months: 48
    views:
      - {var: s_real_ff, mean: -0.5, why: "实际利率向零回升"}
      - {var: s_cpi_yoy, mean: 3.5, why: "通胀逐步回落"}
    overrides:
      r_star: -1.0
    confidence: 1.0
  - name: 回归常态
    months: 72
    views: []
