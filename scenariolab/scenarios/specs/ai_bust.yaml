id: ai_bust
name: AI 泡沫破裂：2000-02 年式
summary: AI 资本开支的回报不及预期，估值从极端高位坍塌（市价/股息两年半从 97 倍降到 73 倍左右），资本开支骤降拖累投资和就业，美联储把利率降到 1.4% 左右；科技股回撤最深。
narrative: |-
  今天的估值和资本开支都处在历史极端：美股股息率约 1.0%（市价/股息约 97 倍，1999-2000 年股息率约 1.0-1.4%），非住宅投资占 GDP 约 15%（1982 年以来最高），利润占 GDP 约 13%，增长高度依赖少数 AI 巨头的资本开支。
  本情景假设 AI 应用的变现速度跟不上算力投资：云厂商下调资本开支指引，数据中心、芯片和电力设备订单骤减，就像 2000-02 年电信和互联网投资的崩塌。
  2000-04 到 2002-10 年的数据：资本开支占 GDP 每年下降约 0.9 个百分点，失业率每年升约 0.7 个百分点，美联储每年降息约 1.6 个百分点，信用利差约 2.9 个百分点，CPI 约 2.5%，工业产出小幅负增长，股息率从 1.0% 升到 1.6%。
  视图从极高估值的起点出发（股息率约 1.3% 的月份），叠加资本开支收缩、失业上升、降息和利差走阔，权重主要落在 2000-02 年；模拟中失业率两年半升到 5.7% 左右，政策利率从 3.75% 降到 1.4% 左右，信用利差按今天偏紧的起点缩放，只从 1.5 升到 2 左右。
  那次估值压缩几乎全部来自宏观因子解释不了的部分，而引擎对抽到的历史月份只保留一半这种残差，所以泡沫破裂期给美股大盘和纳斯达克各加每年 −8%（覆盖项上限）的价格漂移：模拟路径隐含的市价/股息比两年半从 97 倍降到 73 倍左右（2000-02 年从 96 倍降到约 60 倍），纳斯达克回撤最深。
  之后两年半是 2003-05 年式的出清与复苏：低利率、温和复苏、利差收窄，失业率随复苏回落到 4% 左右；最后回到无视图的历史常态，长债因降息上涨，现金收益随利率下降。
tags: [AI, 泡沫, 科技股, 衰退, 降息]
prior_prob: 0.09
analogs: ["2000-04:2002-10", "2022-01:2022-10"]
causal_chain:
  - {from: AI 变现不及预期, to: 资本开支, sign: "-", lag: "0-12月", mechanism: "云厂商下调数据中心和芯片投资指引"}
  - {from: 资本开支, to: 科技股盈利, sign: "+", lag: "0-6月", mechanism: "芯片、设备和电力供应链收入随投资骤降"}
  - {from: 估值极端, to: 股价跌幅, sign: "+", lag: "0-30月", mechanism: "股息率约 1% 的起点没有安全垫，市价/股息两年半降到 73 倍左右"}
  - {from: 资本开支, to: 就业, sign: "+", lag: "3-30月", mechanism: "投资收缩传导到建筑、制造和科技岗位，失业率两年半升到 5.7% 左右"}
  - {from: 财富缩水, to: 高收入消费, sign: "+", lag: "3-12月", mechanism: "前 10% 家庭持有约 87% 的股票，财富效应逆转"}
  - {from: 失业率, to: 政策利率, sign: "-", lag: "0-30月", mechanism: "美联储降息，政策利率两年半从 3.75% 降到 1.4% 左右"}
  - {from: 政策利率, to: 长期国债价格, sign: "-", lag: "0-12月", mechanism: "降息和避险推动长债上涨，10 年期收益率降到 4.3% 左右"}
  - {from: 企业盈利下滑, to: 信用利差, sign: "-", lag: "0-12月", mechanism: "盈利下滑使违约风险上升；2000-02 年利差约 2.9，按今天偏紧的起点缩放，模拟中从 1.5 升到约 2"}
phases:
  - name: 泡沫破裂
    months: 30
    views:
      - {var: s_div_yield, mean: 1.3, why: "从极高估值出发：1999-2001 年和 2021-26 年股息率约 1.0-1.6%"}
      - {var: f_capex_share, mean_annual: -0.9, why: "2000-02 年资本开支占 GDP 每年约降 0.9 个百分点"}
      - {var: f_unrate, mean_annual: 0.7, why: "2000-02 年失业率每年约升 0.7 个百分点"}
      - {var: f_ff, mean_annual: -1.5, why: "2000-02 年美联储每年降息约 1.6 个百分点"}
      - {var: s_spread, mean: 2.8, why: "2000-02 年信用利差均值约 2.9"}
      - {var: s_cpi_yoy, mean: 2.6, why: "需求收缩带来去通胀（2000-02 年约 2.5%）"}
      - {var: s_ip_yoy, mean: -0.5, why: "2000-02 年工业产出同比约 −0.3%"}
    overrides:
      # valuation compression beyond what the drawn months carry: the 2000-02 fall in the market's price was almost all
      # residual (unexplained by the ten factors: about -0.84 log over 30 months, Nasdaq -1.77), and the engine keeps only
      # half of a drawn month's residual (config.RESIDUALS); -0.08 is the bound (schema.ASSET_DRIFT_BOUND)
      asset_drift: {us_equity: -0.08, nasdaq: -0.08}
    confidence: 1.0
  - name: 出清与复苏
    months: 30
    views:
      - {var: s_ff, mean: 1.8, why: "2003-05 年式的低利率（约 1-3%）"}
      - {var: s_ip_yoy, mean: 2.5, why: "2003-05 年工业产出温和复苏"}
      - {var: s_unrate, mean: 5.6, why: "挑选失业率仍偏高的复苏月份（2003 年中至 2005 年约 5-6%，每年降约 0.6 个百分点）"}
      - {var: s_spread, mean: 2.2, why: "利差逐步收窄"}
      - {var: s_cpi_yoy, mean: 2.5, why: "通胀稳定在 2.5% 左右"}
    confidence: 1.0
  - name: 回归常态
    months: 120
    views: []
