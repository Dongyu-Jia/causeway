id: reacceleration
name: 再加速：不着陆
summary: AI 投资、财政赤字和财富效应让经济重新加速，失业率回落到 4% 左右，通胀卡在 3.5-4%，美联储被迫把利率重新加到 5% 左右，10 年期收益率升到 6% 左右，长债和房地产承压。
narrative: |-
  起点的需求并不弱：工业产出同比回升到 2.2%，失业率 4.2%，资本开支占 GDP 是 1982 年以来最高，家庭净值/收入约 8.1 倍、接近 2022 年的历史最高；而美联储已经降息到 3.75%，金融条件宽松（信用利差只有 1.5）。
  本情景假设降息过早：AI 资本开支、财政赤字和前 10% 家庭的财富效应叠加，经济在 2027 年重新加速，劳动力市场再度收紧，通胀不回落而是卡在 3.5-4%。
  历史上的“再加速”有 1983-84 年（工业产出 +6%、加息约 3 个百分点）、1994 年（加息 3 个百分点、债市崩盘）、1999-2000 年和 2005-06 年。
  美联储被迫重新加息：前两年政策利率每年上调约 0.7 个百分点、到 5.1% 左右，中性实际利率覆盖为 1.5%（高于历史默认 0.75%，因为高赤字和投资需求抬高了均衡利率），视图挑选长端收益率上行的月份，10 年期收益率两年内升到 6% 左右。
  第三年起进入“高利率常态”：工业产出增速回落到 2% 左右、通胀约 3.3%、政策利率停在 5% 附近，中性实际利率仍为 1%。
  长债在加息期间跑输通胀，房地产相对承压；被抽到的再加速月份盈利增长强，股票并没有被高利率压垮，但模拟路径隐含的市价/股息比五年里停在 95 倍左右、不再扩张；金融股和现金相对受益。最后回到无视图的历史常态。
tags: [不着陆, 再加速, 加息, 高利率]
prior_prob: 0.07
analogs: ["1983-01:1984-12", "1994-01:1995-02", "1999-06:2000-05", "2005-01:2006-06"]
causal_chain:
  - {from: AI 资本开支与财政赤字, to: 总需求, sign: "+", lag: "0-12月", mechanism: "投资和政府支出同时扩张"}
  - {from: 财富效应, to: 高收入消费, sign: "+", lag: "0-12月", mechanism: "家庭净值/收入接近历史最高，前 10% 家庭支撑消费"}
  - {from: 总需求, to: 失业率, sign: "-", lag: "3-12月", mechanism: "劳动力市场再度收紧，失业率降到 4% 左右"}
  - {from: 劳动力市场收紧, to: 通胀, sign: "+", lag: "6-18月", mechanism: "服务通胀不降，CPI 卡在 3.5-4%"}
  - {from: 通胀, to: 政策利率, sign: "+", lag: "3-12月", mechanism: "美联储重新加息，每年约 0.7 个百分点，两年到 5.1% 左右"}
  - {from: 均衡利率上升, to: 10 年期收益率, sign: "+", lag: "0-24月", mechanism: "高赤字和投资需求抬高中性利率，10 年期两年升到 6% 左右"}
  - {from: 高收益率, to: 股票估值, sign: "-", lag: "0-24月", mechanism: "折现率上升压制估值扩张（市价/股息停在 95 倍左右），盈利增长仍支撑股价"}
  - {from: 高利率, to: 增长, sign: "-", lag: "12-36月", mechanism: "第三年起工业产出增速回落到 2% 左右"}
phases:
  - name: 再加速
    months: 24
    views:
      - {var: s_ip_yoy, mean: 3.5, why: "1983-84/1994 年工业产出同比 5-6%，按今天的潜在增速下调"}
      - {var: f_unrate, mean_annual: -0.25, why: "失业率两年降约 0.5 个百分点"}
      - {var: s_cpi_yoy, mean: 4.0, why: "通胀卡在 4% 左右"}
      - {var: f_ff, mean_annual: 0.75, why: "重新加息（1994 年每年 +2.5，按今天的利率水平下调）"}
      - {var: f_y10, mean_annual: 0.3, why: "挑选长端收益率上行的月份（1983-84 年每年约 +0.6，1994 年约 +2）"}
      - {var: s_spread, mean: 1.6, why: "需求强劲，信用利差维持低位"}
    overrides:
      r_star: 1.5
    confidence: 1.0
  - name: 高利率常态
    months: 36
    views:
      - {var: s_cpi_yoy, mean: 3.5, why: "通胀缓慢回落"}
      - {var: s_ip_yoy, mean: 2.0, why: "增长回落到长期平均"}
      - {var: s_ff, mean: 5.0, why: "政策利率停在 5% 左右的高位（1995-2000 年、2006-07 年、2023-24 年）"}
    overrides:
      r_star: 1.0
    confidence: 1.0
  - name: 回归常态
    months: 120
    views: []
