<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Causeway · 宏观情景实验室</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <!-- ECharts 5.5.1 (Apache-2.0), vendored from the npm package: no CDN, the UI works offline. -->
  <script src="vendor/echarts/echarts.min.js"></script>
</head>
<body class="kline-cn">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CW</div>
        <div>
          <div class="brand-name">宏观情景实验室</div>
          <div class="brand-sub">Causeway</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot" id="build-info"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">总览</h1>
        <div class="topbar-right">
          <label class="kline-pref" title="K 线配色">
            <span>K 线</span>
            <select id="kline-color">
              <option value="cn">红涨绿跌</option>
              <option value="us">绿涨红跌</option>
            </select>
          </label>
          <span class="data-date" id="data-date"></span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
