[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causeway"
version = "0.1.0"
description = "Causal macro factors -> historical-reweighting scenario engine -> asset K-lines, portfolio and withdrawal risk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dongyu Jia" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "requests>=2.31",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Dongyu-Jia/causeway"
Repository = "https://github.com/Dongyu-Jia/causeway"
Issues = "https://github.com/Dongyu-Jia/causeway/issues"

[project.optional-dependencies]
llm = ["anthropic>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
include = ["scenariolab*"]

[tool.setuptools.package-data]
"scenariolab.scenarios" = ["specs/*.yaml"]
"scenariolab.analysis" = ["audit_archive/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
# a minimal rule set: syntax / IO errors (E9) and pyflakes (F: undefined names, unused imports, ...)
select = ["E9", "F"]
